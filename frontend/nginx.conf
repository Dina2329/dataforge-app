server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same proxy split as vite.config.ts's dev server -- the frontend's own
    # apiClient calls relative /api and /ws paths (same-origin) specifically
    # so it never needs a backend host/port baked in, in dev or here.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback -- any other path resolves to index.html so client-side
    # routing (react-router) handles it instead of nginx 404ing on a refresh.
    location / {
        try_files $uri /index.html;
    }
}
